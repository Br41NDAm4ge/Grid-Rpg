<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid de RPG para Mestre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Painel de Controle Superior -->
    <div id="controls">
        <h2>Painel do Mestre</h2>

        <!-- Seleção de Terreno -->
        <div class="control-group">
            <label>Selecione o Terreno:</label>
            <div class="terrain-options">
                <button class="terrain-btn active" data-type="grama" onclick="selectTerrain('grama', this)">🌿 Grama</button>
                <button class="terrain-btn" data-type="terra" onclick="selectTerrain('terra', this)">🟫 Terra</button>
                <button class="terrain-btn" data-type="areia" onclick="selectTerrain('areia', this)">🟨 Areia</button>
                <button class="terrain-btn" data-type="pedra" onclick="selectTerrain('pedra', this)">🏰 Pedra (Castelo)</button>
                <button class="terrain-btn" data-type="masmorra" onclick="selectTerrain('masmorra', this)">💀 Masmorra</button>
            </div>
        </div>

        <!-- Ferramenta de Pintura por Tamanho (Área Quadrada) -->
        <div class="control-group">
            <label for="brush-size">Criar terreno de tamanho:</label>
            <input type="number" id="brush-size" value="1" min="1" max="10">
            <small>(1 = 1x1, 2 = 2x2, etc.)</small>
        </div>

        <!-- Redimensionar Grid Inteiro -->
        <div class="control-group">
            <label>Tamanho do Grid:</label>
            <input type="number" id="grid-cols" value="20" min="5" max="50" style="width: 60px;"> x 
            <input type="number" id="grid-rows" value="20" min="5" max="50" style="width: 60px;">
            <button onclick="resizeGrid()">Criar Novo Grid</button>
        </div>
    </div>

    <!-- Área onde o Grid será desenhado -->
    <div id="grid-container">
        <div id="grid"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
