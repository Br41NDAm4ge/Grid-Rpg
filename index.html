<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid de RPG para Mestre</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Painel de Controle Superior -->
    <header id="controls">
        <div class="panel-title">
            <h2>⚔️ Grid RPG</h2>
        </div>

        <!-- Seleção do Terreno -->
        <div class="control-group">
            <label>Terreno Ativo:</label>
            <div class="terrain-options">
                <button class="terrain-btn active" data-type="grama" onclick="selectTerrain('grama', this)">🌿 Grama</button>
                <button class="terrain-btn" data-type="terra" onclick="selectTerrain('terra', this)">🟫 Terra</button>
                <button class="terrain-btn" data-type="areia" onclick="selectTerrain('areia', this)">🟨 Areia</button>
                <button class="terrain-btn" data-type="pedra" onclick="selectTerrain('pedra', this)">🏰 Pedra</button>
                <button class="terrain-btn" data-type="masmorra" onclick="selectTerrain('masmorra', this)">💀 Masmorra</button>
            </div>
        </div>

        <!-- Ferramenta de Pincel -->
        <div class="control-group">
            <label for="brush-size">Tamanho do Pincel:</label>
            <input type="number" id="brush-size" value="1" min="1" max="10">
        </div>

        <!-- Redimensionar / Novo Grid -->
        <div class="control-group">
            <label>Novo Grid:</label>
            <input type="number" id="grid-cols" value="20" min="5" max="50" style="width: 55px;" title="Colunas"> x 
            <input type="number" id="grid-rows" value="15" min="5" max="50" style="width: 55px;" title="Linhas">
            <button class="btn-create" onclick="resizeGrid()">✨ Criar Novo Grid</button>
        </div>

        <!-- Opção de Linhas -->
        <div class="control-group">
            <label class="checkbox-label">
                <input type="checkbox" id="toggle-grid-lines" checked onchange="toggleGridLines()">
                Linhas do Grid
            </label>
        </div>
    </header>

    <!-- Área do Grid -->
    <main id="grid-container">
        <div id="grid"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
